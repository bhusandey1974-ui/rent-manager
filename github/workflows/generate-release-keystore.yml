name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias rentmanager -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass "RentManager2026Secure" -keypass "RentManager2026Secure" \
          -dname "CN=Rent Manager,O=RentManager,C=IN"
          keytool -list -v -keystore release.keystore -alias rentmanager -storepass "RentManager2026Secure"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
